[project]
name = "ha-analog-displays"
version = "0.1.0"
description = "Home Assistant custom integration driving analog displays from any sensor data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

[tool.ruff]
line-length = 88
target-version = "py313"
# Ruff formats Python blocks inside Markdown; spec.md and the docs are prose
# and must not be rewritten by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A",    # builtins shadowing
    "ASYNC",
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PGH",  # pygrep hooks
    "PL",   # pylint
    "RET",  # return
    "RUF",
    "SIM",  # simplify
    "SLOT",
    "T20",  # no print
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # config flows legitimately take many arguments
    "TRY003",  # long messages outside exception class are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
files = ["custom_components/analog_displays"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
# Home Assistant ships partial stubs; don't fail on its internals.
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components/analog_displays",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
