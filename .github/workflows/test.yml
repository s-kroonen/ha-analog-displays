name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (phacc ${{ matrix.phacc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component pins the Home Assistant
        # version, so this matrix covers the current and previous HA minor.
        phacc: ["0.13.316", "0.13.290"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}" syrupy

      - name: pytest
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.phacc == '0.13.316'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
