name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }}, phacc ${{ matrix.phacc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component pins the Home Assistant
        # version, and the Python floor moves with it: HA 2026.8 onwards
        # requires Python 3.14, and phacc 0.13.316 is the last release that
        # still supports 3.13. So the two must be chosen together.
        include:
          - phacc: "0.13.364"   # HA 2026.9.1, current
            python: "3.14"
          - phacc: "0.13.355"   # HA 2026.8.1, previous minor
            python: "3.14"
          - phacc: "0.13.316"   # HA 2026.2.3, oldest supported (hacs.json)
            python: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}" syrupy

      - name: pytest
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.phacc == '0.13.364'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
