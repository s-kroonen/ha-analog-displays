name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (phacc ${{ matrix.phacc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component pins the Home Assistant
        # version, so the pin is how the HA version is chosen:
        #   0.13.364 -> HA 2026.9.1  (current)
        #   0.13.355 -> HA 2026.8.1  (previous minor)
        #   0.13.316 -> HA 2026.2.3  (oldest supported, see hacs.json)
        phacc: ["0.13.364", "0.13.355", "0.13.316"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}" syrupy

      - name: pytest
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.phacc == '0.13.364'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
