name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify manifest version matches the tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Tags are written without a prefix (0.2.0), but tolerate v0.2.0 and
          # V0.2.0 rather than failing on a cosmetic difference.
          tag="${TAG_NAME}"
          tag="${tag#[vV]}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag available; run this from a published release."
            exit 1
          fi
          manifest_version=$(python -c \
            "import json;print(json.load(open('custom_components/analog_displays/manifest.json'))['version'])")
          echo "tag=$TAG_NAME (normalised to $tag), manifest=$manifest_version"
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag '$TAG_NAME' means version '$tag', but manifest.json says '$manifest_version'."
            echo "Fix it either way round:"
            echo "  - retag this release as '$manifest_version', or"
            echo "  - bump the manifest: python scripts/bump_version.py $tag"
            exit 1
          fi

      - name: Build zip
        run: |
          cd custom_components/analog_displays
          zip -r "$GITHUB_WORKSPACE/analog_displays.zip" . -x '*__pycache__*'

      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: analog_displays.zip
