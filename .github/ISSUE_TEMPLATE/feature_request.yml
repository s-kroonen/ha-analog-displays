name: Feature request
description: Suggest an addition to the integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture check
      options:
        - label: >
            This does not require the integration to talk to hardware directly
            (ESPHome is the hardware interface; this integration only reads and
            writes Home Assistant entities).
